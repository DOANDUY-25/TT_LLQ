<form [formGroup]="form" (ngSubmit)="onSubmit()" class="component-form" autocomplete="off">

  <!-- Hàng 1: Mã cấu phần | Tên cấu phần | Chuẩn tin điện -->
  <div class="form-row-3">

    <!-- Mã cấu phần -->
    <div class="form-group">
      <label class="form-label" for="componentCode">
        Mã cấu phần <span class="required-mark">*</span>
      </label>
      <div class="input-wrapper" [class.input-checking]="checkingCode">
        <input
          id="componentCode"
          type="text"
          formControlName="componentCode"
          class="form-control"
          [class.input-error]="isFieldError('componentCode') || codeDuplicate"
          placeholder="Nhập nội dung"
          maxlength="20"
          (input)="onCodeInput($event)"
          (blur)="onCodeBlur()"
        />
        <!-- Spinner khi đang kiểm tra trùng -->
        <span class="input-status checking" *ngIf="checkingCode" title="Đang kiểm tra...">
          <svg class="spin-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
          </svg>
        </span>
        <!-- Tick xanh khi hợp lệ -->
        <span class="input-status valid"
          *ngIf="!checkingCode && !isFieldError('componentCode') && !codeDuplicate && form.get('componentCode')?.value && form.get('componentCode')?.touched">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
      </div>
      <div class="field-error" *ngIf="isFieldError('componentCode')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ getErrorMessage('componentCode') }}
      </div>
      <div class="field-error" *ngIf="codeDuplicate && !isFieldError('componentCode')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        Mã cấu phần đã tồn tại trong hệ thống
      </div>
    </div>

    <!-- Tên cấu phần -->
    <div class="form-group">
      <label class="form-label" for="componentName">
        Tên cấu phần <span class="required-mark">*</span>
      </label>
      <input
        id="componentName"
        type="text"
        formControlName="componentName"
        class="form-control"
        [class.input-error]="isFieldError('componentName')"
        placeholder="Nhập nội dung"
        maxlength="150"
      />
      <div class="field-error" *ngIf="isFieldError('componentName')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ getErrorMessage('componentName') }}
      </div>
      <div class="char-count" *ngIf="form.get('componentName')?.value?.length > 0">
        {{ form.get('componentName')?.value?.length }}/150
      </div>
    </div>

    <!-- Chuẩn tin điện -->
    <div class="form-group">
      <label class="form-label" for="messageType">Chuẩn tin điện</label>
      <div class="select-wrapper">
        <select id="messageType" formControlName="messageType" class="form-control">
          <option value="">Chọn giá trị</option>
          <option *ngFor="let type of messageTypeOptions" [value]="type">{{ type }}</option>
        </select>
        <svg class="select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
    </div>

  </div>

  <!-- Hàng 2: Tên kết nối | Ngày hiệu lực | Ngày hết hiệu lực -->
  <div class="form-row-3">

    <!-- Tên kết nối -->
    <div class="form-group">
      <label class="form-label" for="connectionMethod">Tên kết nối</label>
      <div class="select-wrapper">
        <select id="connectionMethod" formControlName="connectionMethod" class="form-control">
          <option value="">Chọn giá trị</option>
          <option *ngFor="let method of connectionMethodOptions" [value]="method">{{ method }}</option>
        </select>
        <svg class="select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
    </div>

    <!-- Ngày hiệu lực -->
    <div class="form-group">
      <label class="form-label" for="effectiveDate">
        Ngày hiệu lực <span class="required-mark">*</span>
      </label>
      <div class="date-wrapper">
        <input
          id="effectiveDate"
          type="datetime-local"
          formControlName="effectiveDate"
          class="form-control"
          [class.input-error]="isFieldError('effectiveDate')"
          (change)="validateEffectiveDate()"
          (blur)="validateEffectiveDate()"
        />
        <svg class="date-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
      </div>
      <div class="field-error" *ngIf="isFieldError('effectiveDate')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ getErrorMessage('effectiveDate') }}
      </div>
    </div>

    <!-- Ngày hết hiệu lực -->
    <div class="form-group">
      <label class="form-label" for="endEffectiveDate">Ngày hết hiệu lực</label>
      <div class="date-wrapper">
        <input
          id="endEffectiveDate"
          type="datetime-local"
          formControlName="endEffectiveDate"
          class="form-control"
          [class.input-error]="isFieldError('endEffectiveDate')"
          (change)="validateEndEffectiveDate()"
          (blur)="validateEndEffectiveDate()"
        />
        <svg class="date-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
      </div>
      <div class="field-error" *ngIf="isFieldError('endEffectiveDate')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ getErrorMessage('endEffectiveDate') }}
      </div>
    </div>

  </div>

  <!-- Hàng 3: Checkbox Kiểm tra Token/ký số -->
  <div class="form-row-full">
    <label class="checkbox-label" for="checkToken">
      <input
        type="checkbox"
        id="checkToken"
        formControlName="checkToken"
        class="checkbox-input"
      />
      <span class="checkbox-custom"></span>
      <span class="checkbox-text">Kiểm tra Token/ký số</span>
    </label>
  </div>

</form>
