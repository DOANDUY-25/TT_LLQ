<tui-root>
  <div *ngIf="isAuthPage">
    <router-outlet></router-outlet>
  </div>

<div class="app-shell" *ngIf="!isAuthPage">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="9" height="9" rx="2" fill="currentColor" opacity="0.8"/>
          <rect x="13" y="2" width="9" height="9" rx="2" fill="currentColor"/>
          <rect x="2" y="13" width="9" height="9" rx="2" fill="currentColor"/>
          <rect x="13" y="13" width="9" height="9" rx="2" fill="currentColor" opacity="0.6"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">PMH</span>
        <span class="brand-subtitle">Hệ thống tham số</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <span class="nav-section-title">Tham số</span>

        <a routerLink="/components" routerLinkActive="active"
           [routerLinkActiveOptions]="{exact: false}" class="nav-item">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          <span>Cấu phần xử lý</span>
        </a>

        <a routerLink="/group-categories" routerLinkActive="active"
           [routerLinkActiveOptions]="{exact: false}" class="nav-item">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
          </svg>
          <span>Danh mục theo nhóm</span>
        </a>

        <a routerLink="/transaction-logs" routerLinkActive="active"
           [routerLinkActiveOptions]="{exact: false}" class="nav-item">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          <span>Lịch sử giao dịch</span>
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">{{ (currentUser?.username || 'A').charAt(0).toUpperCase() }}</div>
        <div class="user-details">
          <span class="user-name">{{ currentUser?.fullName || currentUser?.username || 'Admin' }}</span>
          <span class="user-role">{{ getUserRoles() }}</span>
        </div>
        <button class="btn-logout" (click)="logout()" title="Đăng xuất">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <div class="main-wrapper">
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-left">
        <h2 class="page-breadcrumb">{{ title }}</h2>
      </div>
      <div class="topbar-right">
        <div class="topbar-date">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span id="topbar-date-display"></span>
        </div>

        <button class="btn-topbar-logout" (click)="logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span>Đăng xuất</span>
        </button>
      </div>
    </header>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
</tui-root>
